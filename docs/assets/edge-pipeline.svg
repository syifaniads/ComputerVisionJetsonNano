<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc"><title id="title">Jetson Nano ONNX image-classification pipeline</title><desc id="desc">Camera frames are resized, normalized in ImageNet format, passed through a MobileNetV2 ONNX model, converted to probabilities, and rendered with label confidence and inference time.</desc><rect width="1200" height="360" fill="#0d1117"/><style>.b{fill:#161b22;stroke:#58a6ff;stroke-width:2;rx:14}.g{fill:#161b22;stroke:#3fb950;stroke-width:2;rx:14}.o{fill:#161b22;stroke:#d29922;stroke-width:2;rx:14}.t{fill:#f0f6fc;font:600 17px system-ui,-apple-system,Segoe UI,sans-serif}.s{fill:#8b949e;font:14px system-ui,-apple-system,Segoe UI,sans-serif}.l{stroke:#8b949e;stroke-width:3;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8b949e"/></marker></defs><text x="35" y="42" class="t">Jetson Nano edge-classification path</text><text x="35" y="68" class="s">Historical ONNX/OpenCV flow, expressed as an implementation-derived architecture visual</text><rect x="30" y="125" width="160" height="90" class="b"/><text x="70" y="160" class="t">Camera</text><text x="57" y="185" class="s">640×480 BGR</text><rect x="230" y="105" width="210" height="130" class="b"/><text x="268" y="140" class="t">Preprocess</text><text x="260" y="165" class="s">resize 224×224</text><text x="260" y="188" class="s">RGB · NCHW</text><text x="260" y="211" class="s">ImageNet normalize</text><rect x="480" y="125" width="190" height="90" class="o"/><text x="510" y="160" class="t">MobileNetV2</text><text x="520" y="185" class="s">ONNX Runtime</text><rect x="710" y="105" width="190" height="130" class="g"/><text x="758" y="140" class="t">Scores</text><text x="746" y="165" class="s">stable softmax</text><text x="746" y="188" class="s">argmax</text><text x="746" y="211" class="s">label/confidence</text><rect x="940" y="125" width="220" height="90" class="g"/><text x="985" y="160" class="t">Video Overlay</text><text x="975" y="185" class="s">prediction + latency</text><path d="M190 170 H230" class="l"/><path d="M440 170 H480" class="l"/><path d="M670 170 H710" class="l"/><path d="M900 170 H940" class="l"/></svg>